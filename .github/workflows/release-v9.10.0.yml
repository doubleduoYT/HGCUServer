name: Publish HGCUServer v9.10.0

on:
  push:
    branches:
      - main
    paths:
      - .release_parts/ready.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Reconstruct and verify source archive
        run: |
          cat .release_parts/part*.b64 | base64 --decode > HGCUServer_v9.10.0_Source.zip
          echo "ae0059e06135a4fd3460ff7f840f346e07713fca267f633a3a21bd15c044b60e  HGCUServer_v9.10.0_Source.zip" | sha256sum -c -
          unzip -t HGCUServer_v9.10.0_Source.zip
          unzip -Z1 HGCUServer_v9.10.0_Source.zip | sort > files.txt
          printf 'HGPlazaServer.cs\nhg_discord_bot.py\n' | sort > expected.txt
          diff -u expected.txt files.txt
          unzip -o HGCUServer_v9.10.0_Source.zip -d .
          rm -f expected.txt files.txt
          python3 -m py_compile hg_discord_bot.py

      - name: Publish source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HGPlazaServer.cs hg_discord_bot.py HGCUServer_v9.10.0_Source.zip
          git rm -r .release_parts
          git commit -m "release: publish HGCUServer v9.10.0 source"
          git push

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v9.10.0 HGCUServer_v9.10.0_Source.zip \
            --title "HGCUServer v9.10.0" \
            --target "$(git rev-parse HEAD)" \
            --notes "Source release for HGCUServer, a community multiplayer server for Casualties: Unknown Mobile. Includes the C# relay server and Python Discord bridge. Features Plaza, Exploration, Internet Rooms, persistent worlds, session recovery, Discord integration, map capture and MapCast."
