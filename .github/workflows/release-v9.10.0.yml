name: Publish v9.10.0

on:
  push:
    branches:
      - main
    paths:
      - HGCUServer_v9.10.0_Source.zip

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Verify source package
        run: |
          unzip -t HGCUServer_v9.10.0_Source.zip
          unzip -Z1 HGCUServer_v9.10.0_Source.zip | sort > files.txt
          printf 'HGPlazaServer.cs\nhg_discord_bot.py\n' | sort > expected.txt
          diff -u expected.txt files.txt
          unzip -o HGCUServer_v9.10.0_Source.zip -d .
          rm -f expected.txt files.txt
          python3 -m py_compile hg_discord_bot.py

      - name: Publish extracted source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add HGPlazaServer.cs hg_discord_bot.py
          if ! git diff --cached --quiet; then
            git commit -m "release: publish HGCUServer v9.10.0 source files [skip ci]"
            git push
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v9.10.0 HGCUServer_v9.10.0_Source.zip \
            --title "HGCUServer v9.10.0" \
            --target "$(git rev-parse HEAD)" \
            --notes "Source release for HGCUServer, a community multiplayer server for Casualties: Unknown Mobile. Includes the C# relay server and Python Discord bridge. Features Plaza, Exploration, Internet Rooms, session recovery, persistent world and player data, Discord integration, map capture, and MapCast."
